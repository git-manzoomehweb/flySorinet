<basis
  core="dbsource"
  source="basiscore"
  lid="1"
  mid="20"
  name="db"
  catid="[##cms.query.catid##]"
>
  <member
    name="tour-list"
    type="list"
    link="tour.bc"
    propertyid="7244,7249,8077,10000504,8181,8076"
    perpage="6"
    pageno="[##cms.query.pagenum|(1)##]"
    size="412x295"
    order="date desc"
  />
  <member
    name="paging"
    type="list"
    request="paging"
    count="2"
    parentname="tour-list"
  />
</basis>

<section class="flex flex-col gap-3">
  <!-- tour-list -->
  <basis core="list" datamembername="db.tour-list">
    <else-layout>
      <div class="w-full flex justify-center font-bold">
        هیچ موردی یافت نشد.
      </div>
    </else-layout>
    <layout>
      <div class="w-full flex flex-col gap-3">@child</div>
    </layout>

    <face filter="link is null">
      <a
        href="/tour.bc?id=@id"
        class="relative bg-white overflow-hidden border border-solid pb-7 border-zinc-300 rounded-xl"
      >
        <div class="relative h-64">
          <div class="absolute w-full h-full bg-shadow-gradient"></div>
          <img
            src="@00412X00295prp"
            alt="@title"
            loading="lazy"
            class="object-cover w-full h-full"
          />
          <div class="absolute bottom-8 right-4">
            <h3 class="mb-2 text-xl text-white">@title</h3>
            <div class="flex items-center gap-2">
              <img
                src="[##cms.cms.cdn##]/images/clockIcon.svg"
                alt=""
                width="24"
                height="24"
                loading="lazy"
              />
              <span class="text-sm text-white">@prp_8076</span>
            </div>
          </div>
        </div>
        <span
          class="absolute flex items-center hover:scale-105 justify-center w-28 h-12 px-4 py-2 text-lg text-white top-[56%] left-5 rounded-xl bg-Primery-700"
        >
          مشاهده
        </span>
        <div class="flex flex-col gap-2 px-4 mt-9">
          <span class="flex items-center text-sm text-zinc-900">
            <img
              src="[##cms.cms.cdn##]/images/calenderIcon.svg"
              alt="calenderIcon"
              width="24"
              height="24"
              loading="lazy"
            />
            تاریخ رفت : @prp_8077
          </span>
          <span class="flex items-center text-sm text-zinc-900">
            <img
              src="[##cms.cms.cdn##]/images/mapIcon.svg"
              alt="mapIcon"
              width="24"
              height="24"
              loading="lazy"
            />
            ایرلاین: @prp_10000504
          </span>
          <div class="flex justify-between w-full">
            <span class="flex items-center text-sm text-zinc-900">
              <img
                src="[##cms.cms.cdn##]/images/coinIcon.svg"
                alt="coinIcon"
                width="24"
                height="24"
                loading="lazy"
              />
              شروع قیمت از:
            </span>
            <span class="font-medium text-zinc-900">@prp_8181</span>
          </div>
        </div>
      </a>
    </face>
    <face>
      <a
        href="@link"
        class="relative bg-white overflow-hidden border border-solid pb-7 border-zinc-300 rounded-xl"
      >
        <div class="relative h-64">
          <div class="absolute w-full h-full bg-shadow-gradient"></div>
          <img
            src="@00412X00295prp"
            alt="@title"
            loading="lazy"
            class="object-cover w-full h-full"
          />
          <div class="absolute bottom-8 right-4">
            <h3 class="mb-2 text-xl text-white">@title</h3>
            <div class="flex items-center gap-2">
              <img
                src="[##cms.cms.cdn##]/images/clockIcon.svg"
                alt="clockIcon"
                width="24"
                height="24"
                loading="lazy"
              />
              <span class="text-sm text-white">@prp_8076</span>
            </div>
          </div>
        </div>
        <span
          class="absolute flex items-center hover:scale-105 justify-center w-28 h-12 px-4 py-2 text-lg text-white top-[56%] left-5 rounded-xl bg-Primery-700"
        >
          مشاهده
        </span>
        <div class="flex flex-col gap-2 px-4 mt-9">
          <span class="flex items-center text-sm text-zinc-900">
            <img
              src="[##cms.cms.cdn##]/images/calenderIcon.svg"
              alt="calenderIcon"
              width="24"
              height="24"
              loading="lazy"
            />
            تاریخ رفت : @prp_8077
          </span>
          <span class="flex items-center text-sm text-zinc-900">
            <img
              src="[##cms.cms.cdn##]/images/mapIcon.svg"
              alt="mapIcon"
              width="24"
              height="24"
              loading="lazy"
            />
            ایرلاین: @prp_10000504
          </span>
          <div class="flex justify-between w-full">
            <span class="flex items-center text-sm text-zinc-900">
              <img
                src="[##cms.cms.cdn##]/images/coinIcon.svg"
                alt="coinIcon"
                width="24"
                height="24"
                loading="lazy"
              />
              شروع قیمت از:
            </span>
            <span class="font-medium text-zinc-900">@prp_8181</span>
          </div>
        </div>
      </a>
    </face>
  </basis>
  <!-- tour list end -->

  <div id="paging" class="flex items-center justify-center gap-2 mt-16">
    <ul class="flex gap-3 cd-pagination no-space dir-ltr" id="wibpaging">
      <basis core="print" datamembername="db.paging">
        <face filter="(@sta='pre')and('[##cms.cms.pageurl##]'='')">
          <li
            class="flex items-center justify-center w-12 h-12 page-no prev-page rounded-xl bg-Primery-600 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full cursor-pointer text-zinc-900"
              aria-label="angle-left"
              onclick="FetchPageNumPrev2('@page')"
              ><svg
                width="11"
                height="17"
                class="inline-block align-middle"
                viewBox="0 0 11 17"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M8.7499 16.914L0.335938 8.5L8.7499 0.0859985L10.1639 1.5L3.1639 8.5L10.1639 15.5L8.7499 16.914Z"
                  fill="#fff"
                /></svg
            ></span>
          </li>
        </face>
        <face filter="(@sta='pre')and('[##cms.cms.pageurl##]'<>'')">
          <li
            class="flex items-center justify-center w-12 h-12 page-no prev-page rounded-xl bg-Primery-600 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full cursor-pointer text-zinc-900"
              aria-label="angle-left"
              onclick="FetchPageNumPrev2('@page')"
              ><svg
                width="11"
                height="17"
                class="inline-block align-middle"
                viewBox="0 0 11 17"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M8.7499 16.914L0.335938 8.5L8.7499 0.0859985L10.1639 1.5L3.1639 8.5L10.1639 15.5L8.7499 16.914Z"
                  fill="#fff"
                /></svg
            ></span>
          </li>
        </face>
      </basis>
      <basis core="print" datamembername="db.paging">
        <face
          filter="(@page=[##cms.query.pagenum|(1)##])and('[##cms.cms.pageurl##]'='')"
        >
          <li
            class="flex items-center justify-center w-12 h-12 overflow-hidden page-no rounded-xl bg-zinc-300 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full h-full text-white cursor-pointer page-number bg-Primery-600"
              data-pagenum="@page"
              onclick="FetchWithPageNum2('@page')"
              >@page</span
            >
          </li>
        </face>
        <face
          filter="(@page=[##cms.query.pagenum|(1)##])and('[##cms.cms.pageurl##]'<>'')"
        >
          <li
            class="flex items-center justify-center w-12 h-12 overflow-hidden page-no rounded-xl bg-zinc-300 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full h-full text-white cursor-pointer page-number bg-Primery-600"
              data-pagenum="@page"
              onclick="FetchWithPageNum2('@page')"
              >@page</span
            >
          </li>
        </face>
        <face
          filter="(@page<>[##cms.query.pagenum|(1)##]) and (@page>0) and (@sta='no') and ('[##cms.cms.pageurl##]'='') "
        >
          <li
            class="flex items-center justify-center w-12 h-12 page-no rounded-xl bg-zinc-300 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full h-full cursor-pointer page-number text-zinc-900"
              data-pagenum="@page"
              onclick="FetchWithPageNum2('@page')"
              >@page</span
            >
          </li>
        </face>
        <face
          filter="(@page<>[##cms.query.pagenum|(1)##]) and (@page>0) and (@sta='no') and ('[##cms.cms.pageurl##]'<>'') "
        >
          <li
            class="flex items-center justify-center w-12 h-12 page-no rounded-xl bg-zinc-300 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full h-full cursor-pointer page-number text-zinc-900"
              data-pagenum="@page"
              onclick="FetchWithPageNum2('@page')"
              >@page</span
            >
          </li>
        </face>
      </basis>
      <basis core="print" datamembername="db.paging">
        <face filter="(@sta='nex') and ('[##cms.cms.pageurl##]'='')">
          <li
            class="flex items-center justify-center w-12 h-12 page-no next-page rounded-xl bg-Primery-600 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full h-full cursor-pointer text-zinc-900"
              aria-label="angle-right"
              onclick="FetchPageNumNext2('@page')"
              ><svg
                width="11"
                height="17"
                class="inline-block align-middle"
                viewBox="0 0 11 17"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M2.2501 0.0860016L10.6641 8.5L2.2501 16.914L0.836102 15.5L7.8361 8.5L0.836103 1.5L2.2501 0.0860016Z"
                  fill="#fff"
                /></svg
            ></span>
          </li>
        </face>
        <face filter="(@sta='nex') and ('[##cms.cms.pageurl##]'<>'')">
          <li
            class="flex items-center justify-center w-12 h-12 page-no next-page rounded-xl bg-Primery-600 hover:scale-105"
          >
            <span
              class="flex items-center justify-center w-full h-full cursor-pointer text-zinc-900"
              aria-label="angle-right"
              onclick="FetchPageNumNext2('@page')"
              ><svg
                width="11"
                height="17"
                class="inline-block align-middle"
                viewBox="0 0 11 17"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M2.2501 0.0860016L10.6641 8.5L2.2501 16.914L0.836102 15.5L7.8361 8.5L0.836103 1.5L2.2501 0.0860016Z"
                  fill="#fff"
                /></svg
            ></span>
          </li>
        </face>
      </basis>
    </ul>
  </div>
</section>
